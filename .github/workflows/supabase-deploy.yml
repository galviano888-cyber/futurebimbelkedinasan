name: Supabase deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      push_migrations:
        description: Apply pending migrations
        required: true
        type: boolean
        default: false
      deploy_functions:
        description: Deploy Edge Functions
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migration diff
        if: ${{ inputs.push_migrations }}
        run: supabase db diff --linked

      - name: Push migrations
        if: ${{ inputs.push_migrations }}
        run: supabase db push --linked

      - name: Deploy Edge Functions
        if: ${{ inputs.deploy_functions }}
        run: |
          supabase functions deploy pakasir-create
          supabase functions deploy pakasir-status
          supabase functions deploy pakasir-activate
          supabase functions deploy pakasir-webhook --no-verify-jwt

      - name: Set Edge Function secrets
        if: ${{ inputs.deploy_functions }}
        run: |
          supabase secrets set \
            PAKASIR_SLUG="${{ secrets.PAKASIR_SLUG }}" \
            PAKASIR_API_KEY="${{ secrets.PAKASIR_API_KEY }}"
